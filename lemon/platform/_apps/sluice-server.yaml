apiVersion: kappctrl.k14s.io/v1alpha1
kind: App
metadata:
  name: sluice-server
  namespace: app-install
  annotations:
    kapp.k14s.io/change-group: "{name}"
    kapp.k14s.io/change-rule.create-order.1: "upsert after upserting haproxy"
    kapp.k14s.io/change-rule.delete-order.1: "delete before deleting haproxy"
    kapp.k14s.io/change-rule.create-order.2: "upsert after upserting traefik"
    kapp.k14s.io/change-rule.delete-order.2: "delete before deleting traefik"
    kapp.k14s.io/change-rule.create-order.3: "upsert after upserting reloader"
    kapp.k14s.io/change-rule.delete-order.3: "delete before deleting reloader"
spec:
  serviceAccountName: kapp
  fetch:
  - git:
      url: https://github.com/making/k8s-gitops.git
      ref: origin/main
      subPath: lemon/platform/sluice-server
  - git:
      url: https://github.com/making/sluice.git
      ref: origin/images
  syncPeriod: 10m
  template:
  - sops:
      age:
        privateKeysSecretRef:
          name: age-key
  - ytt:
      paths:
      - 0/config
      valuesFrom:
      - path: 0/values.yaml
      - path: 1/sluice-server_native.yaml
  - kbld:
      paths:
      - '-'
  deploy:
  - kapp:
      rawOptions:
      - --wait-timeout=5m
      - --diff-changes=true
      - --diff-mask=true
      delete:
        #! Force delete PVCs, since StatefulSet does not delete them
        rawOptions:
        - --apply-ignored=true