apiVersion: kappctrl.k14s.io/v1alpha1
kind: App
metadata:
  name: dex
  namespace: app-install
  annotations:
    kapp.k14s.io/change-group: "{name}"
    kapp.k14s.io/change-rule.create-order.1: "upsert after upserting traefik"
    kapp.k14s.io/change-rule.delete-order.1: "delete before deleting traefik"
    kapp.k14s.io/change-rule.create-order.2: "upsert after upserting cert-manager"
    kapp.k14s.io/change-rule.delete-order.2: "delete before deleting cert-manager"
spec:
  serviceAccountName: kapp
  fetch:
  - helmChart:
      name: dex
      version: "0.26.0"
      repository:
        url: https://charts.dexidp.io
  - git:
      url: https://github.com/making/k8s-gitops.git
      ref: origin/main
      subPath: lemon/platform/dex
  syncPeriod: 24h
  template:
  - sops:
      age:
        privateKeysSecretRef:
          name: age-key
  - ytt:
      paths:
      - 1/helm-values.yaml
      valuesFrom:
      - path: 1/credentials.yaml
  - helmTemplate:
      name: dex
      namespace: dex
      path: "0"
      valuesFrom:
      - path: "-"
  - ytt:
      paths:
      - '-'
      - 1/config
      valuesFrom:
      - path: 1/credentials.yaml
  deploy:
  - kapp:
      rawOptions:
      - --wait-timeout=5m
      - --diff-changes=true
      - --diff-mask=true
      delete:
        #! Force delete PVCs, since StatefulSet does not delete them
        rawOptions:
        - --apply-ignored=true
