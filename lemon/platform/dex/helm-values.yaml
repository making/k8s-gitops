#@ load("@ytt:data", "data")

image:
  #! Chart 0.26.0 ships v2.46.0; v2.46.1 is the latest dex patch release.
  tag: v2.46.1

config:
  issuer: #@ "https://" + data.values.DEX_HOST
  storage:
    type: kubernetes
    config:
      inCluster: true
  oauth2:
    grantTypes:
    - authorization_code
    - refresh_token
    skipApprovalScreen: true
  staticClients: #@ data.values.STATIC_CLIENTS
  connectors:
  - type: github
    id: github
    name: GitHub
    config:
      #! Expanded by dex from the dex-config Secret (DEX_EXPAND_ENV defaults to true).
      clientID: $GITHUB_CLIENT_ID
      clientSecret: $GITHUB_CLIENT_SECRET
      redirectURI: #@ "https://" + data.values.DEX_HOST + "/callback"
      orgs:
      - name: #@ data.values.GITHUB_ORG

envVars:
- name: GITHUB_CLIENT_ID
  valueFrom:
    secretKeyRef:
      name: dex-config
      key: GITHUB_CLIENT_ID
- name: GITHUB_CLIENT_SECRET
  valueFrom:
    secretKeyRef:
      name: dex-config
      key: GITHUB_CLIENT_SECRET

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
  - host: #@ data.values.DEX_HOST
    paths:
    - path: /
      pathType: Prefix
  tls:
  - hosts:
    - #@ data.values.DEX_HOST
    secretName: dex-tls
