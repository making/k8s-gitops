#@ load("@ytt:data", "data")
#@ def cluster_nodes():
#@   nodes = []
#@   for i in range(data.values.replicas):
#@     nodes.append("sluice-server-{}=grpcs://control-{}.sluice.ik.am:443".format(i, i))
#@   end
#@   return ",".join(nodes)
#@ end
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sluice-server
  namespace: sluice
  annotations:
    reloader.stakater.com/auto: "true"
    secret.reloader.stakater.com/reload: "sluice-system-ik-am-tls,sluice-apps-ik-am-tls"
    reloader.stakater.com/rollout-strategy: "restart"
spec:
  serviceName: sluice-server-headless
  replicas: #@ data.values.replicas
  #! nodes do not depend on each other; rolling updates stay one pod at a time
  podManagementPolicy: Parallel
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sluice-server
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
        prometheus.io/scrape: "true"
        prometheus.io/scheme: https
      labels:
        app: sluice-server
        app.kubernetes.io/name: sluice-server
        github.com/revision: #@ data.values.git_revision
    spec:
      automountServiceAccountToken: false
      #! service-link env vars (SLUICE_SERVER_0_PORT=tcp://...) would be bound as
      #! sluice.* properties
      enableServiceLinks: false
      #! longer than sluice.cluster.drain-grace (10s)
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: sluice-server
      containers:
      - name: sluice-server
        #! the digest from sluice-server_native.yaml of the sluice images branch
        image: #@ data.values.image
        imagePullPolicy: Always
        ports:
        - name: grpc
          containerPort: 8001
        - name: data
          containerPort: 8000
        - name: http
          containerPort: 8081
        env:
        - name: sluice.node.id
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        #! static membership; haproxy routes control-N.sluice.ik.am by SNI to the
        #! Service sluice-server-N
        - name: sluice.cluster.nodes
          value: #@ cluster_nodes()
        #! covers the client reconnect backoff (max 30s), so a restarted node holds every
        #! client's routes before the next one is rolled
        - name: sluice.cluster.warmup
          value: 30s
        #! PROXY protocol from haproxy: data plane (8000, tcp routes) and control plane (8001)
        - name: sluice.data-proxy-protocol
          value: "true"
        - name: sluice.control-proxy-protocol
          value: "true"
        #! TCP routes may only claim the middleware ports exposed on the Service
        #! - name: sluice.tcp-port-range
        #!   value: 5432,5671-5676,6379-6380,9092-9097,1099-1101,5000-5010,7070-7075,10334-10336,40404-40406
        - name: sluice.token-file
          value: /mnt/secrets/token
        - name: sluice.data-tls-bundle
          value: apps
        - name: server.ssl.enabled
          value: "true"
        - name: server.ssl.bundle
          value: system
        - name: spring.grpc.server.ssl.bundle
          value: system
        #! per-route credentials file, mounted from the sluice-server-route-auth secret
        - name: spring.config.additional-location
          value: file:///mnt/route-auth/route-auth.yml
        #! the server's own listeners (console, gRPC): the system certificate
        - name: spring.ssl.bundle.pem.system.keystore.certificate
          value: file:///mnt/certs-system/tls.crt
        - name: spring.ssl.bundle.pem.system.keystore.private-key
          value: file:///mnt/certs-system/tls.key
        #! the data plane (tunnel routes): the apps certificate, so the browsers do not
        #! coalesce the console onto a data-plane connection
        - name: spring.ssl.bundle.pem.apps.keystore.certificate
          value: file:///mnt/certs-apps/tls.crt
        - name: spring.ssl.bundle.pem.apps.keystore.private-key
          value: file:///mnt/certs-apps/tls.key
        - name: spring.security.user.name
          valueFrom:
            secretKeyRef:
              name: sluice-token
              key: username
        - name: spring.security.user.password
          valueFrom:
            secretKeyRef:
              name: sluice-token
              key: password
        - name: logging.structured.format.console
          value: ecs
        - name: logging.level.am.ik.sluice.server.SluiceServerApplication
          value: debug
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
            scheme: HTTPS
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
            scheme: HTTPS
          periodSeconds: 10
          failureThreshold: 30
        resources:
          limits:
            memory: 512Mi
        #! read-only root filesystem; Tomcat's temp dir is the /tmp emptyDir
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: token
          mountPath: /mnt/secrets
        - name: certs-system
          mountPath: /mnt/certs-system
        - name: certs-apps
          mountPath: /mnt/certs-apps
        - name: route-auth
          mountPath: /mnt/route-auth
      volumes:
      - name: tmp
        emptyDir: {}
      - name: token
        secret:
          secretName: sluice-token
      - name: certs-system
        secret:
          secretName: sluice-system-ik-am-tls
      - name: certs-apps
        secret:
          secretName: sluice-apps-ik-am-tls
      #! kapp rewrites this to the current versioned name (sluice-server-route-auth-ver-N)
      - name: route-auth
        secret:
          secretName: sluice-server-route-auth
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sluice-server
  namespace: sluice
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sluice-server
