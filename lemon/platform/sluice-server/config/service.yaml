#@ load("@ytt:data", "data")
#@ load("@ytt:struct", "struct")
#! shared entry for haproxy: bootstrap control plane (control.sluice.ik.am), data plane
#! and TCP routes. Ready nodes only (readiness is down while warming up / draining).
apiVersion: v1
kind: Service
metadata:
  name: sluice-server
  namespace: sluice
spec:
  type: ClusterIP
  clusterIP: 10.96.106.41
  selector:
    app.kubernetes.io/name: sluice-server
  ports:
  - name: grpc
    port: 8001
    protocol: TCP
    targetPort: 8001
  - name: data
    port: 8000
    protocol: TCP
    targetPort: 8000
  - name: http
    port: 8081
    protocol: TCP
    targetPort: 8081
  #@ for name, port in struct.decode(data.values.tcp_route_ports).items():
  - name: #@ name
    port: #@ port
    protocol: TCP
    targetPort: #@ port
  #@ end
---
#! governing Service of the StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: sluice-server-headless
  namespace: sluice
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: sluice-server
  ports:
  - name: grpc
    port: 8001
    protocol: TCP
    targetPort: 8001
#@ for i in range(data.values.replicas):
---
#! per-node control plane (control-N.sluice.ik.am in haproxy) and console. Not-ready
#! pods stay published: clients must reach a node during its warmup, which is exactly
#! when its readiness is down.
apiVersion: v1
kind: Service
metadata:
  name: #@ "sluice-server-{}".format(i)
  namespace: sluice
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: sluice-server
    statefulset.kubernetes.io/pod-name: #@ "sluice-server-{}".format(i)
  ports:
  - name: grpc
    port: 8001
    protocol: TCP
    targetPort: 8001
  - name: http
    port: 8081
    protocol: TCP
    targetPort: 8081
#@ end
