#@ load("@ytt:data", "data")
#! shared entry for haproxy: bootstrap control plane (control.sluice.ik.am), data plane
#! and TCP routes. Ready nodes only (readiness is down while warming up / draining).
apiVersion: v1
kind: Service
metadata:
  name: sluice-server
  namespace: sluice
spec:
  type: ClusterIP
  clusterIP: 10.96.106.41
  selector:
    app.kubernetes.io/name: sluice-server
  ports:
  - name: grpc
    port: 8001
    protocol: TCP
    targetPort: 8001
  - name: data
    port: 8000
    protocol: TCP
    targetPort: 8000
  - name: http
    port: 8081
    protocol: TCP
    targetPort: 8081
  #! TCP-route listeners: the server opens one listener per client-advertised
  #! listen-port, so the well-known middleware ports must be exposed on the
  #! Service. Plain and TLS-denominated variants where the ecosystem has one.
  - name: postgresql
    port: 5432
    protocol: TCP
    targetPort: 5432
  #! RabbitMQ: 3 nodes; node N = 5672+2(N-1) amqp / +1 amqps
  - name: rabbitmq-1
    port: 5672
    protocol: TCP
    targetPort: 5672
  - name: rabbitmq-1-tls
    port: 5671
    protocol: TCP
    targetPort: 5671
  - name: rabbitmq-2
    port: 5674
    protocol: TCP
    targetPort: 5674
  - name: rabbitmq-2-tls
    port: 5673
    protocol: TCP
    targetPort: 5673
  - name: rabbitmq-3
    port: 5676
    protocol: TCP
    targetPort: 5676
  - name: rabbitmq-3-tls
    port: 5675
    protocol: TCP
    targetPort: 5675
  - name: redis
    port: 6379
    protocol: TCP
    targetPort: 6379
  - name: redis-tls
    port: 6380
    protocol: TCP
    targetPort: 6380
  #! Kafka: 3 brokers; broker N = 9092+2(N-1) plaintext / +1 TLS listener
  - name: kafka-1
    port: 9092
    protocol: TCP
    targetPort: 9092
  - name: kafka-1-tls
    port: 9093
    protocol: TCP
    targetPort: 9093
  - name: kafka-2
    port: 9094
    protocol: TCP
    targetPort: 9094
  - name: kafka-2-tls
    port: 9095
    protocol: TCP
    targetPort: 9095
  - name: kafka-3
    port: 9096
    protocol: TCP
    targetPort: 9096
  - name: kafka-3-tls
    port: 9097
    protocol: TCP
    targetPort: 9097
  #! GemFire: 3 members each for locator / cache-server / JMX; one contiguous
  #! range per role so a cluster maps to a range
  - name: gemfire-jmx-1
    port: 1099
    protocol: TCP
    targetPort: 1099
  - name: gemfire-jmx-2
    port: 1100
    protocol: TCP
    targetPort: 1100
  - name: gemfire-jmx-3
    port: 1101
    protocol: TCP
    targetPort: 1101
  - name: gemfire-locator-1
    port: 10334
    protocol: TCP
    targetPort: 10334
  - name: gemfire-locator-2
    port: 10335
    protocol: TCP
    targetPort: 10335
  - name: gemfire-locator-3
    port: 10336
    protocol: TCP
    targetPort: 10336
  - name: gemfire-server-1
    port: 40404
    protocol: TCP
    targetPort: 40404
  - name: gemfire-server-2
    port: 40405
    protocol: TCP
    targetPort: 40405
  - name: gemfire-server-3
    port: 40406
    protocol: TCP
    targetPort: 40406  #! GemFire WAN replication endpoints
  - name: gemfire-wan-1
    port: 5000
    protocol: TCP
    targetPort: 5000
  - name: gemfire-wan-2
    port: 5001
    protocol: TCP
    targetPort: 5001
  - name: gemfire-wan-3
    port: 5002
    protocol: TCP
    targetPort: 5002
  - name: gemfire-wan-4
    port: 5003
    protocol: TCP
    targetPort: 5003
  - name: gemfire-wan-5
    port: 5004
    protocol: TCP
    targetPort: 5004
  - name: gemfire-wan-6
    port: 5005
    protocol: TCP
    targetPort: 5005
  - name: gemfire-wan-7
    port: 5006
    protocol: TCP
    targetPort: 5006
  - name: gemfire-wan-8
    port: 5007
    protocol: TCP
    targetPort: 5007
  - name: gemfire-wan-9
    port: 5008
    protocol: TCP
    targetPort: 5008
  - name: gemfire-wan-10
    port: 5009
    protocol: TCP
    targetPort: 5009
  - name: gemfire-wan-11
    port: 5010
    protocol: TCP
    targetPort: 5010
  #! gemfire-locator-web-1  (k8s port name shortened)
  - name: gf-loc-web-1
    port: 7070
    protocol: TCP
    targetPort: 7070
  #! gemfire-server-web-1  (k8s port name shortened)
  - name: gf-srv-web-1
    port: 7071
    protocol: TCP
    targetPort: 7071
  #! gemfire-locator-web-2  (k8s port name shortened)
  - name: gf-loc-web-2
    port: 7072
    protocol: TCP
    targetPort: 7072
  #! gemfire-server-web-2  (k8s port name shortened)
  - name: gf-srv-web-2
    port: 7073
    protocol: TCP
    targetPort: 7073
  #! gemfire-locator-web-3  (k8s port name shortened)
  - name: gf-loc-web-3
    port: 7074
    protocol: TCP
    targetPort: 7074
  #! gemfire-server-web-3  (k8s port name shortened)
  - name: gf-srv-web-3
    port: 7075
    protocol: TCP
    targetPort: 7075
---
#! governing Service of the StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: sluice-server-headless
  namespace: sluice
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: sluice-server
  ports:
  - name: grpc
    port: 8001
    protocol: TCP
    targetPort: 8001
#@ for i in range(data.values.replicas):
---
#! per-node control plane (control-N.sluice.ik.am in haproxy) and console. Not-ready
#! pods stay published: clients must reach a node during its warmup, which is exactly
#! when its readiness is down.
apiVersion: v1
kind: Service
metadata:
  name: #@ "sluice-server-{}".format(i)
  namespace: sluice
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: sluice-server
    statefulset.kubernetes.io/pod-name: #@ "sluice-server-{}".format(i)
  ports:
  - name: grpc
    port: 8001
    protocol: TCP
    targetPort: 8001
  - name: http
    port: 8081
    protocol: TCP
    targetPort: 8081
#@ end
