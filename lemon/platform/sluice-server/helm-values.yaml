applicationName: sluice-server

deployment:
  image:
    repository: ghcr.io/making/sluice/sluice-server
    tag: native
    pullPolicy: Always
  additionalPodAnnotations:
    prometheus.io/path: /actuator/prometheus
    prometheus.io/port: "8081"
    prometheus.io/scrape: "true"
  resources:
    limits:
      memory: 512Mi
  env:
    sluice.token-file:
      value: /mnt/secrets/token
    sluice.data-tls-bundle:
      value: cert-manager
    spring.grpc.server.ssl.bundle:
      value: cert-manager
    spring.ssl.bundle.pem.cert-manager.keystore.certificate:
      value: /mnt/certs/tls.crt
    spring.ssl.bundle.pem.cert-manager.keystore.private-key:
      value: /mnt/certs/tls.key
    logging.structured.format.console:
      value: ecs
    logging.level.am.ik.sluice.server.SluiceServerApplication:
      value: debug
  readinessProbe:
    enabled: true
    httpGet:
      path: /actuator/health/readiness
      port: 8081
    periodSeconds: 5
  livenessProbe:
    enabled: true
    httpGet:
      path: /actuator/health/liveness
      port: 8081
    periodSeconds: 10
  # the chart defaults to a read-only root filesystem; Tomcat needs a writable
  # temp dir, so back /tmp with an emptyDir
  containerSecurityContext:
    runAsNonRoot: true
  volumes:
    tmp:
      emptyDir: { }
    token:
      secret:
        secretName: sluice-token
    certs:
      secret:
        secretName: sluice-ik-am-tls
  volumeMounts:
    tmp:
      mountPath: /tmp
    token:
      mountPath: /mnt/secrets
    certs:
      mountPath: /mnt/certs
service:
  type: ClusterIP
  ports:
  - name: grpc
    port: 8001
    protocol: TCP
    targetPort: 8001
  - name: data
    port: 8000
    protocol: TCP
    targetPort: 8000
  - name: http
    port: 8081
    protocol: TCP
    targetPort: 8081