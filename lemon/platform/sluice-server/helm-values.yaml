  - name: gemfire-wan-10
    port: 5009
    protocol: TCP
    targetPort: 5009
  - name: gemfire-wan-11
    port: 5010
    protocol: TCP
    targetPort: 5010
  # gemfire-locator-web-1  (k8s port name shortened)
  - name: gf-loc-web-1
    port: 7070
    protocol: TCP
    targetPort: 7070
  # gemfire-server-web-1  (k8s port name shortened)
  - name: gf-srv-web-1
    port: 7071
    protocol: TCP
    targetPort: 7071
  # gemfire-locator-web-2  (k8s port name shortened)
  - name: gf-loc-web-2
    port: 7072
    protocol: TCP
    targetPort: 7072
  # gemfire-server-web-2  (k8s port name shortened)
