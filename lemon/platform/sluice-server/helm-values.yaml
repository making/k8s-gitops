applicationName: sluice-server

deployment:
  image:
    repository: ghcr.io/making/sluice/sluice-server
    tag: native
    pullPolicy: Always
  podLabels:
    app: sluice-server
  annotations:
    secret.reloader.stakater.com/reload: "sluice-system-ik-am-tls,sluice-apps-ik-am-tls"
    reloader.stakater.com/rollout-strategy: "restart"
  additionalPodAnnotations:
    prometheus.io/path: /actuator/prometheus
    prometheus.io/port: "8081"
    prometheus.io/scrape: "true"
    prometheus.io/scheme: https
  resources:
    limits:
      memory: 512Mi
  env:
    # PROXY protocol from haproxy: data plane (8000, tcp routes) and control plane (8001)
    sluice.data-proxy-protocol:
      value: "true"
    sluice.control-proxy-protocol:
      value: "true"
    # TCP routes may only claim the middleware ports exposed on the Service
    # sluice.tcp-port-range:
    #  value: 5432,5671-5676,6379-6380,9092-9097,1099-1101,5000-5010,7070-7075,10334-10336,40404-40406
    sluice.token-file:
      value: /mnt/secrets/token
    sluice.data-tls-bundle:
      value: apps
    server.ssl.enabled:
      value: "true"
    server.ssl.bundle:
      value: system
    spring.grpc.server.ssl.bundle:
      value: system
    # the server's own listeners (console, gRPC): the system certificate
    # per-route credentials file, mounted from the sluice-server-route-auth secret
    spring.config.additional-location:
      value: file:///mnt/route-auth/route-auth.properties
    spring.ssl.bundle.pem.system.keystore.certificate:
      value: file:///mnt/certs-system/tls.crt
    spring.ssl.bundle.pem.system.keystore.private-key:
      value: file:///mnt/certs-system/tls.key
    # the data plane (tunnel routes): the apps certificate, so the browsers do not
    # coalesce the console onto a data-plane connection
    spring.ssl.bundle.pem.apps.keystore.certificate:
      value: file:///mnt/certs-apps/tls.crt
    spring.ssl.bundle.pem.apps.keystore.private-key:
      value: file:///mnt/certs-apps/tls.key
    spring.security.user.name:
      valueFrom:
        secretKeyRef:
          name: sluice-token
          key: username
    spring.security.user.password:
      valueFrom:
        secretKeyRef:
          name: sluice-token
          key: password
    logging.structured.format.console:
      value: ecs
    logging.level.am.ik.sluice.server.SluiceServerApplication:
      value: debug
  readinessProbe:
    enabled: true
    httpGet:
      path: /actuator/health/readiness
      port: 8081
      scheme: HTTPS
    periodSeconds: 5
  livenessProbe:
    enabled: true
    httpGet:
      path: /actuator/health/liveness
      port: 8081
      scheme: HTTPS
    periodSeconds: 10
  # the chart defaults to a read-only root filesystem; Tomcat needs a writable
  # temp dir, so back /tmp with an emptyDir
  containerSecurityContext:
    runAsNonRoot: true
  volumes:
    tmp:
      emptyDir: { }
    token:
      secret:
        secretName: sluice-token
    certs-system:
      secret:
        secretName: sluice-system-ik-am-tls
    certs-apps:
      secret:
        secretName: sluice-apps-ik-am-tls
    route-auth:
      secret:
        secretName: sluice-server-route-auth
  volumeMounts:
    tmp:
      mountPath: /tmp
    token:
      mountPath: /mnt/secrets
    certs-system:
      mountPath: /mnt/certs-system
    certs-apps:
      mountPath: /mnt/certs-apps
    route-auth:
      mountPath: /mnt/route-auth
service:
  type: ClusterIP
  clusterIP: 10.96.106.41
  ports:
  - name: grpc
    port: 8001
    protocol: TCP
    targetPort: 8001
  - name: data
    port: 8000
    protocol: TCP
    targetPort: 8000
  - name: http
    port: 8081
    protocol: TCP
    targetPort: 8081
  # TCP-route listeners: the server opens one listener per client-advertised
  # listen-port, so the well-known middleware ports must be exposed on the
  # Service. Plain and TLS-denominated variants where the ecosystem has one.
  - name: postgresql
    port: 5432
    protocol: TCP
    targetPort: 5432
  # RabbitMQ: 3 nodes; node N = 5672+2(N-1) amqp / +1 amqps
  - name: rabbitmq-1
    port: 5672
    protocol: TCP
    targetPort: 5672
  - name: rabbitmq-1-tls
    port: 5671
    protocol: TCP
    targetPort: 5671
  - name: rabbitmq-2
    port: 5674
    protocol: TCP
    targetPort: 5674
  - name: rabbitmq-2-tls
    port: 5673
    protocol: TCP
    targetPort: 5673
  - name: rabbitmq-3
    port: 5676
    protocol: TCP
    targetPort: 5676
  - name: rabbitmq-3-tls
    port: 5675
    protocol: TCP
    targetPort: 5675
  - name: redis
    port: 6379
    protocol: TCP
    targetPort: 6379
  - name: redis-tls
    port: 6380
    protocol: TCP
    targetPort: 6380
  # Kafka: 3 brokers; broker N = 9092+2(N-1) plaintext / +1 TLS listener
  - name: kafka-1
    port: 9092
    protocol: TCP
    targetPort: 9092
  - name: kafka-1-tls
    port: 9093
    protocol: TCP
    targetPort: 9093
  - name: kafka-2
    port: 9094
    protocol: TCP
    targetPort: 9094
  - name: kafka-2-tls
    port: 9095
    protocol: TCP
    targetPort: 9095
  - name: kafka-3
    port: 9096
    protocol: TCP
    targetPort: 9096
  - name: kafka-3-tls
    port: 9097
    protocol: TCP
    targetPort: 9097
  # GemFire: 3 members each for locator / cache-server / JMX; one contiguous
  # range per role so a cluster maps to a range
  - name: gemfire-jmx-1
    port: 1099
    protocol: TCP
    targetPort: 1099
  - name: gemfire-jmx-2
    port: 1100
    protocol: TCP
    targetPort: 1100
  - name: gemfire-jmx-3
    port: 1101
    protocol: TCP
    targetPort: 1101
  - name: gemfire-locator-1
    port: 10334
    protocol: TCP
    targetPort: 10334
  - name: gemfire-locator-2
    port: 10335
    protocol: TCP
    targetPort: 10335
  - name: gemfire-locator-3
    port: 10336
    protocol: TCP
    targetPort: 10336
  - name: gemfire-server-1
    port: 40404
    protocol: TCP
    targetPort: 40404
  - name: gemfire-server-2
    port: 40405
    protocol: TCP
    targetPort: 40405
  - name: gemfire-server-3
    port: 40406
    protocol: TCP
    targetPort: 40406  # GemFire WAN replication endpoints
  - name: gemfire-wan-1
    port: 5000
    protocol: TCP
    targetPort: 5000
  - name: gemfire-wan-2
    port: 5001
    protocol: TCP
    targetPort: 5001
  - name: gemfire-wan-3
    port: 5002
    protocol: TCP
    targetPort: 5002
  - name: gemfire-wan-4
    port: 5003
    protocol: TCP
    targetPort: 5003
  - name: gemfire-wan-5
    port: 5004
    protocol: TCP
    targetPort: 5004
  - name: gemfire-wan-6
    port: 5005
    protocol: TCP
    targetPort: 5005
  - name: gemfire-wan-7
    port: 5006
    protocol: TCP
    targetPort: 5006
  - name: gemfire-wan-8
    port: 5007
    protocol: TCP
    targetPort: 5007
  - name: gemfire-wan-9
    port: 5008
    protocol: TCP
