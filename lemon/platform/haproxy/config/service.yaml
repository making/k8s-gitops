apiVersion: v1
kind: Service
metadata:
  name: haproxy
  namespace: haproxy
  annotations:
    oci-network-load-balancer.oraclecloud.com/is-preserve-source: "true"
    oci-network-load-balancer.oraclecloud.com/security-list-management-mode: All
    oci.oraclecloud.com/load-balancer-type: nlb
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
  - name: minecraft
    port: 25565
    targetPort: 25565
    protocol: TCP
  - name: mc-vanilla
    port: 35565
    targetPort: 35565
    protocol: TCP
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: ldap
    port: 389
    targetPort: 8389
    protocol: TCP
  - name: ldaps
    port: 636
    targetPort: 8636
    protocol: TCP
  - name: vault-audit
    port: 9090
    targetPort: 9090
    protocol: TCP
  # sluice TCP routes: NLB port == haproxy bind port == sluice listen port
  - name: gemfire-jmx-1
    port: 1099
    targetPort: 1099
    protocol: TCP
  - name: gemfire-jmx-2
    port: 1100
    targetPort: 1100
    protocol: TCP
  - name: gemfire-jmx-3
    port: 1101
    targetPort: 1101
    protocol: TCP
  - name: postgresql
    port: 5432
    targetPort: 5432
    protocol: TCP
  - name: rabbitmq-1-tls
    port: 5671
    targetPort: 5671
    protocol: TCP
  - name: rabbitmq-1
    port: 5672
    targetPort: 5672
    protocol: TCP
  - name: rabbitmq-2-tls
    port: 5673
    targetPort: 5673
    protocol: TCP
  - name: rabbitmq-2
    port: 5674
    targetPort: 5674
    protocol: TCP
  - name: rabbitmq-3-tls
    port: 5675
    targetPort: 5675
    protocol: TCP
  - name: rabbitmq-3
    port: 5676
    targetPort: 5676
    protocol: TCP
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  - name: redis-tls
    port: 6380
    targetPort: 6380
    protocol: TCP
  - name: kafka-1
    port: 9092
    targetPort: 9092
    protocol: TCP
  - name: kafka-1-tls
    port: 9093
    targetPort: 9093
    protocol: TCP
  - name: kafka-2
    port: 9094
    targetPort: 9094
    protocol: TCP
  - name: kafka-2-tls
    port: 9095
    targetPort: 9095
    protocol: TCP
  - name: kafka-3
    port: 9096
    targetPort: 9096
    protocol: TCP
  - name: kafka-3-tls
    port: 9097
    targetPort: 9097
    protocol: TCP
  - name: gemfire-locator-1
    port: 10334
    targetPort: 10334
    protocol: TCP
  - name: gemfire-locator-2
    port: 10335
    targetPort: 10335
    protocol: TCP
  - name: gemfire-locator-3
    port: 10336
    targetPort: 10336
    protocol: TCP
  - name: gemfire-server-1
    port: 40404
    targetPort: 40404
    protocol: TCP
  - name: gemfire-server-2
    port: 40405
    targetPort: 40405
    protocol: TCP
  - name: gemfire-server-3
    port: 40406
    targetPort: 40406
    protocol: TCP
  selector:
    app: haproxy