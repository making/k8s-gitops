apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: haproxy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      #! Combined with the required podAntiAffinity below, surge is forbidden:
      #! a 3rd pod can never satisfy "different node from the other two" on a
      #! 2-node cluster. Drop 1 pod first, then create the replacement on the
      #! freed node.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      #! Must exceed preStop sleep + HAProxy soft-stop drain time.
      #! OCI NLB needs ~30s to mark the node unhealthy via healthCheckNodePort,
      #! then we still want time for in-flight connections to finish.
      #! preStop (60s) + hard-stop-after (60s) = 120s, plus 10s buffer.
      terminationGracePeriodSeconds: 130
      containers:
      - name: haproxy
        image: haproxy:3.2
        lifecycle:
          preStop:
            exec:
              #! Keep accepting traffic until OCI NLB stops routing to this node.
              #! The healthCheckNodePort flips to "no local endpoints" the moment
              #! this Pod becomes Terminating, but the NLB takes ~30s to react;
              #! 60s gives kube-proxy + NLB enough buffer to settle.
              command: [ "/bin/sh", "-c", "sleep 60" ]
        ports:
        - containerPort: 25565
          name: minecraft
        - containerPort: 35565
          name: mc-vanilla
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        - containerPort: 8444
          name: health
        - containerPort: 8389
          name: ldap
        - containerPort: 8636
          name: ldaps
        - containerPort: 9090
          name: vault-audit
        #! sluice TCP routes (mirrors the frontends in haproxy.cfg)
        - containerPort: 1099
          name: gemfire-jmx-1
        - containerPort: 1100
          name: gemfire-jmx-2
        - containerPort: 1101
          name: gemfire-jmx-3
        - containerPort: 5432
          name: postgresql
        - containerPort: 5671
          name: rabbitmq-1-tls
        - containerPort: 5672
          name: rabbitmq-1
        - containerPort: 5673
          name: rabbitmq-2-tls
        - containerPort: 5674
          name: rabbitmq-2
        - containerPort: 5675
          name: rabbitmq-3-tls
        - containerPort: 5676
          name: rabbitmq-3
        - containerPort: 6379
          name: redis
        - containerPort: 6380
          name: redis-tls
        - containerPort: 9092
          name: kafka-1
        - containerPort: 9093
          name: kafka-1-tls
        - containerPort: 9094
          name: kafka-2
        - containerPort: 9095
          name: kafka-2-tls
        - containerPort: 9096
          name: kafka-3
        - containerPort: 9097
          name: kafka-3-tls
        - containerPort: 10334
          name: gf-locator-1
        - containerPort: 10335
          name: gf-locator-2
        - containerPort: 10336
          name: gf-locator-3
        - containerPort: 40404
          name: gf-server-1
        - containerPort: 40405
          name: gf-server-2
        - containerPort: 40406
          name: gf-server-3
        - containerPort: 5000
          name: gemfire-wan-1
        - containerPort: 5001
          name: gemfire-wan-2
        - containerPort: 5002
          name: gemfire-wan-3
        - containerPort: 5003
          name: gemfire-wan-4
        - containerPort: 5004
          name: gemfire-wan-5
        - containerPort: 5005
          name: gemfire-wan-6
        - containerPort: 5006
          name: gemfire-wan-7
        - containerPort: 5007
          name: gemfire-wan-8
        - containerPort: 5008
          name: gemfire-wan-9
        - containerPort: 5009
          name: gemfire-wan-10
        - containerPort: 5010
          name: gemfire-wan-11

        volumeMounts:
        - name: haproxy-config
          mountPath: /usr/local/etc/haproxy/haproxy.cfg
          subPath: haproxy.cfg
        - name: blocked-ips
          mountPath: /usr/local/etc/haproxy/blocked-ips.txt
          subPath: blocked-ips.txt
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 99
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8444
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8444
          initialDelaySeconds: 5
          periodSeconds: 10
      affinity:
        podAntiAffinity:
          #! Hard-require pods on different nodes so externalTrafficPolicy: Local
          #! always has a local endpoint on each node hosting an haproxy pod.
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: haproxy
            topologyKey: kubernetes.io/hostname
      volumes:
      - name: haproxy-config
        configMap:
          name: haproxy-config
      - name: blocked-ips
        configMap:
          name: haproxy-blocked-ips